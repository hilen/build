          scp $SSH_OPTS dist/manifest.json uploader@$HOST:$DL/
          # The app manifest and one per daemon, each only when its lane built something.
          for f in dist/updater.json dist/*-updater.json; do
            if [ -f "$f" ]; then
              scp $SSH_OPTS "$f" uploader@$HOST:$DL/
            fi
          done
name: release

# The desktop release of a hilen app, called from the app's own release.yml
# on a `v*` tag. One platform per runner. Every build step is a rustscript
# under build/release/ of the app's build submodule, this file only wires the
# runners, the secrets and the upload host together. Where the files go comes
# from the [release] table of the app's hilen.toml.

on:
  workflow_call:
    inputs:
      infisical_project:
        description: The Infisical project of the app, its prod env is put into every build.
        type: string
        required: true
      mac:
        description: Build the mac release. Its targets are mac_targets in hilen.toml.
        type: boolean
        default: true
      windows:
        description: The Windows cpus to build as a JSON list, x64 and arm64. An empty list skips Windows.
        type: string
        default: '["x64","arm64"]'
      linux:
        description: The Linux cpus to build as a JSON list, x64 and aarch64. An empty list skips Linux.
        type: string
        default: '["x64","aarch64"]'

env:
  INFISICAL_URL: https://infisical.tailf87cbe.ts.net
  APP_PROJECT_ID: ${{ inputs.infisical_project }}
  APPLE_PROJECT_ID: e2dd64d9-130c-4072-bd3d-0a98331364cb

jobs:
  discover:
    runs-on: [self-hosted, tc]
    outputs:
      host: ${{ steps.h.outputs.host }}
      dl-dir: ${{ steps.h.outputs.dl-dir }}
    steps:
      - shell: bash
        run: |
          # Files left by docker are owned by root, checkout cannot clean them.
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi
      - uses: actions/checkout@v6
      - uses: hilen/build/.github/actions/init@main
      - id: h
        shell: bash
        run: rust build/release/host.rs
      - shell: bash
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            uploader@${{ steps.h.outputs.host }} "bash -c 'mkdir -p ${{ steps.h.outputs.dl-dir }}'"

  build-mac:
    needs: discover
    if: ${{ inputs.mac }}
    runs-on: [self-hosted, mac1]
    steps:
      - uses: actions/checkout@v6
      - uses: hilen/build/.github/actions/init@main
      - shell: bash
        run: bash build/release/with-secrets.sh $APPLE_PROJECT_ID $APP_PROJECT_ID -- make release-mac
      - uses: ./build/.github/actions/upload
        with:
          host: ${{ needs.discover.outputs.host }}
          dl-dir: ${{ needs.discover.outputs.dl-dir }}

  build-linux:
    needs: discover
    if: ${{ inputs.linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.linux) }}
    runs-on: ${{ matrix.arch == 'aarch64' && fromJSON('["self-hosted","mac"]') || fromJSON('["self-hosted","tc"]') }}
    steps:
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi
      - uses: actions/checkout@v6
      - uses: hilen/build/.github/actions/init@main
      - shell: bash
        run: bash build/release/with-secrets.sh $APP_PROJECT_ID -- rust build/release/linux.rs --arch=${{ matrix.arch }}
      - uses: ./build/.github/actions/upload
        with:
          host: ${{ needs.discover.outputs.host }}
          dl-dir: ${{ needs.discover.outputs.dl-dir }}

  build-windows:
    needs: discover
    if: ${{ inputs.windows != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.windows) }}
    runs-on: [self-hosted, tc]
    steps:
      - shell: bash
        run: |
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi
      - uses: actions/checkout@v6
      - uses: hilen/build/.github/actions/init@main
      - shell: bash
        run: bash build/release/with-secrets.sh $APP_PROJECT_ID -- rust build/release/win.rs --arch=${{ matrix.arch }}
      - uses: ./build/.github/actions/upload
        with:
          host: ${{ needs.discover.outputs.host }}
          dl-dir: ${{ needs.discover.outputs.dl-dir }}

  manifest:
    needs: [discover, build-mac, build-linux, build-windows]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: [self-hosted, tc]
    steps:
      - shell: bash
        run: |
          if [ -d "${{ runner.workspace }}" ]; then
            docker run --rm -v "${{ runner.workspace }}":/ws alpine chown -R $(id -u):$(id -g) /ws
          fi
      - uses: actions/checkout@v6
      - uses: hilen/build/.github/actions/init@main
      - shell: bash
        env:
          HOST: ${{ needs.discover.outputs.host }}
          DL: ${{ needs.discover.outputs.dl-dir }}
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          mkdir -p dist
          ssh $SSH_OPTS uploader@$HOST "ls $DL" > dist/present.txt
          for meta in $(grep '\.meta\.json$' dist/present.txt); do
            scp $SSH_OPTS uploader@$HOST:$DL/$meta dist/
          done
          rust build/release/manifest.rs --present dist/present.txt
          scp $SSH_OPTS dist/manifest.json uploader@$HOST:$DL/
          # The app manifest and one per daemon, each only when a lane built something.
          for f in dist/updater.json dist/*-updater.json; do
            if [ -f "$f" ]; then
              scp $SSH_OPTS "$f" uploader@$HOST:$DL/
            fi
          done
