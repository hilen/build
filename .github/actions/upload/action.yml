name: upload
description: Sends every file in dist/ to the download folder of the app through the upload door of beekeeper.

inputs:
  infisical_project:
    description: The Infisical project of the app, it holds UPLOAD_TOKEN.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # The checkout wipes dist/, so it holds only what this job built.
        bash build/release/with-secrets.sh "${{ inputs.infisical_project }}" -- bash build/release/door.sh put dist/*
