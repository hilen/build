[package]
name = "build-scripts"
version = "0.0.0"
edition = "2024"

# rustscript resolves a script's crate dependencies from the nearest Cargo.toml,
# so this is what lets the scripts `use shared::..` and pull in regex and tokio.
[dependencies]
anyhow = "1.0"
ed25519-dalek = "2"
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shared = { path = "shared" }
tokio = { version = "1", features = ["full"] }

# The scripts use these, there is no src folder for cargo machete to scan. An
# app whose .gitignore does not hide build/ would fail its machete check here.
[package.metadata.cargo-machete]
ignored = ["anyhow", "ed25519-dalek", "hex", "regex", "reqwest", "serde", "serde_json", "sha2", "shared", "tokio"]

# Its own workspace root, so the submodule stays self contained and a consuming
# repo never has to list it as a member.
[workspace]
