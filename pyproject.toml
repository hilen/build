[project]
name = "hilen-build"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.2",
    "msgspec>=0.22.0",
]

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

# shared is installed into the environment, so a script in any folder of the
# repo imports it.
[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = "py"

[tool.ruff]
target-version = "py314"
line-length = 100
include = ["*.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Comments only for a why, no docstrings.
    "D",
    # Scripts print to the terminal.
    "T201",
    # Commands are fixed tools, never outside input.
    "S603",
    "S607",
    # Conflicts with `ruff format`.
    "COM812",
    # The script folders are not packages.
    "INP001",
    # No copyright headers.
    "CPY001",
    # Type only imports stay at the top, like a Rust `use`.
    "TC003",
]

# msgspec reads the field types of a Struct at run time.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["msgspec.Struct"]

[tool.ruff.lint.flake8-annotations]
# No `-> None`, like a Rust fn without a return type.
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"py/tests/**" = ["S101"]

[tool.ty.environment]
python-version = "3.14"
root = ["py", "py/tests"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
pythonpath = ["py"]
testpaths = ["py/tests"]
